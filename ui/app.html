// ── The photo grid both readings share (the website's and Instagram's) ─────
const PH = { website: { st: () => WS, paint: () => paintWebsite($('#view')) }, instagram: { st: () => IGS, paint: () => paintInstagram($('#view')) } };
/** Ticked to begin with: the gym's own premises, coach and member photos — not stock, no big lettering, not a
 *  before-and-after (never used in ads), sharp enough, not a repeat, not filed already. */
function phDefaults(d){
  const photos = {};
  for (const p of d.reading.photos){
    const own = ['premises','coaches','members'].includes(p.kind) && !p.stock && p.lettering !== 'prominent' && !p.before_after;
    photos[p.id] = { on: own && !p.low_res && !p.have && !p.duplicate_of && !p.dropped, kind: d.file_as.includes(p.file_as) ? p.file_as : 'other', keep_low_res:false };
  }
  return photos;
}
function phShown(key){ const st = PH[key].st(); return st.data.reading.photos.filter(p=>!p.dropped && (st.dups || !p.duplicate_of)); }
function photoGrid(key, { hint='', extra='' } = {}){
  const st = PH[key].st(), d = st.data, r = d.reading, k = st.pick;
  const shown = phShown(key), byKind = (kd) => shown.filter(p=>p.kind===kd), vis = st.filter==='all' ? shown : byKind(st.filter);
  const tile = (p) => { const x = k.photos[p.id];
    const flags = [p.before_after&&'<span class="wflag bad">before and after: never used</span>', p.low_res&&`<span class="wflag warn" title="under ${d.min_photo_px} px on the long side">${p.size[0]}×${p.size[1]} · low resolution</span>`, p.stock&&'<span class="wflag warn">looks like stock</span>', p.lettering==='prominent'&&'<span class="wflag warn">words on it</span>', p.have&&`<span class="wflag">already here: ${esc(p.have)}</span>`, p.duplicate_of&&`<span class="wflag">same as ${esc(p.duplicate_of)}</span>`, p.original&&'<span class="wflag" title="the site\'s original upload, not the page\'s smaller copy">original</span>',
      p.post&&`<a class="wflag" href="${esc(p.post)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">post${p.of>1?` · ${p.in_post} of ${p.of}`:''}${p.taken?` · ${esc(p.taken.slice(0,10))}`:''}</a>`].filter(Boolean).join('');
    return `<div class="wph ${x.on?'on':'off'}"><div class="im" onclick="phToggle('${key}','${p.id}')"><img src="${esc(p.thumb_url)}" alt="" loading="lazy"></div><span class="tick">${x.on?'✓':''}</span>
      <div class="m"><b title="${esc(p.what)}">${esc(p.what||p.id)}</b>${p.size[0]}×${p.size[1]} · ${esc(W_KIND[p.kind]||p.kind)}${p.people?` · ${p.people} ${p.people===1?'person':'people'}`:''}
        <select onchange="PH['${key}'].st().pick.photos['${p.id}'].kind=this.value">${d.file_as.map(f=>`<option value="${f}" ${x.kind===f?'selected':''}>File as ${W_FILE[f]||f}</option>`).join('')}</select>
        <div class="flags">${flags}</div>
        ${p.low_res&&x.on?`<label style="font-size:11px;display:flex;gap:5px;align-items:center;margin-top:5px"><input type="checkbox" style="width:auto" ${x.keep_low_res?'checked':''} onchange="PH['${key}'].st().pick.photos['${p.id}'].keep_low_res=this.checked"> keep it anyway</label>`:''}
      </div></div>`; };
  const kinds = Object.keys(W_KIND).filter(kd=>byKind(kd).length);
  return `<div class="card"><div class="row"><h3 style="margin:0">Photos <span class="pill">${shown.length}</span></h3><div class="spacer"></div>
      <button class="sm" onclick="phAll('${key}',true)">Tick the shown</button><button class="sm" onclick="phAll('${key}',false)">Untick the shown</button></div>
    ${hint?`<p class="hint" style="margin-top:8px">${hint}</p>`:''}
    <div class="chips" style="margin:8px 0 10px"><span class="chip ${st.filter==='all'?'sel':''}" onclick="phFilter('${key}','all')">All ${shown.length}</span>${kinds.map(kd=>`<span class="chip ${st.filter===kd?'sel':''}" onclick="phFilter('${key}','${kd}')">${W_KIND[kd]} ${byKind(kd).length}</span>`).join('')}
      <label style="font-size:12px;display:inline-flex;gap:5px;align-items:center;margin-left:8px"><input type="checkbox" style="width:auto" ${st.dups?'checked':''} onchange="phDups('${key}',this.checked)"> show repeats (${r.photos.filter(p=>p.duplicate_of).length})</label></div>
    ${vis.length?`<div class="wgrid">${vis.map(tile).join('')}</div>`:'<p class="hint">No photos of this kind.</p>'}
    ${extra}</div>`;
}
function phToggle(key, id){ const x = PH[key].st().pick.photos[id]; x.on = !x.on; PH[key].paint(); }
function phFilter(key, kd){ PH[key].st().filter = kd; PH[key].paint(); }
function phDups(key, on){ PH[key].st().dups = on; PH[key].paint(); }
function phAll(key, on){ const st = PH[key].st(); for (const p of phShown(key).filter(p=>st.filter==='all'||p.kind===st.filter)) st.pick.photos[p.id].on = on; PH[key].paint(); }

    <div id="runbox"></div></div>

function igRead(){

function aToggle(name){ if (A.sel.has(name)) A.sel.delete(name); else A.sel.add(name); paintAssets($('#view')); }
function aMsg(file, text, cls=''){ const box = $('#aMsgs'); if (!box) return; let el = box.querySelector(`[data-f="${CSS.escape(file)}"]`); if (!el){ el = document.createElement('div'); el.className='amsg'; el.dataset.f=file; box.appendChild(el); } el.className = `amsg ${cls}`; el.textContent = `${file}: ${text}`; }
function aDrop(ev){ ev.preventDefault(); $('#aDrop')?.classList.remove('over'); aFiles(ev.dataTransfer.files); }
async function aFiles(files){ await aUploadKind(files, A.kind, async()=>{ await loadAssets(); const box=$('#aMsgs'); const keep=box?box.innerHTML:''; paintAssets($('#view')); const b2=$('#aMsgs'); if (b2) b2.innerHTML = keep; }); }
/** Upload files one by one as raw bytes; the server keeps images only, named from the file, filed by kind. */
async function aKeepLowRes(name, after){ const x = A.lowRes?.[name]; if (!x) return; delete A.lowRes[name]; await aUploadKind([x.f], x.kind, after, true); }
async function aUploadKind(files, kind, after, keepLowRes=false){
  for (const f of [...files]) {
    const m = f.name.match(/\.(png|jpe?g|webp|heic|svg)$/i);
    const ext = m ? m[1].toLowerCase().replace('jpeg','jpg') : (f.type==='image/png'?'png':f.type==='image/webp'?'webp':f.type==='image/svg+xml'?'svg':'jpg');
    const name = `${slugify(f.name.replace(/\.[^.]+$/,'')).slice(0,48) || kind}.${ext}`;
    aMsg(f.name, 'uploading…');
    try {
      const r = await panelFetch(`/api/client/${STATE.sel}/asset/${kind}/${name}`, { method:'PUT', headers:{'content-type':f.type||'application/octet-stream','x-original-name':encodeURIComponent(f.name), ...(keepLowRes?{'x-keep-low-res':'1'}:{})}, body: await f.arrayBuffer() });
      const j = await r.json().catch(()=>({error:'bad response'}));
      if (!r.ok && j.low_res && !keepLowRes) { A.lowRes = A.lowRes || {}; A.lowRes[f.name] = { f, kind }; aMsg(f.name, `${j.error}.`, 'err'); const el = $('#aMsgs')?.querySelector(`[data-f="${CSS.escape(f.name)}"]`); if (el){ const b = document.createElement('button'); b.className='sm'; b.style.marginLeft='8px'; b.textContent='Keep it anyway'; b.onclick = ()=>aKeepLowRes(f.name, after); el.appendChild(b); } continue; }
      if (!r.ok) throw new Error(j.error || r.statusText);
      aMsg(f.name, `saved as ${j.asset.path}${j.asset.logo_set?" · now the profile's logo":''}${j.asset.low_res_kept?' · kept at low resolution':''}`, 'ok');
      if (j.asset.logo_set) await refreshProfile();
    } catch(e){ aMsg(f.name, e.message, 'err'); }
  }
  if (after) await after();
}

const setPath = (obj,path,val) => {
  const ks = path.split('.'); let o = obj;
  for (let i=0;i<ks.length-1;i++){ const k=ks[i], nk=ks[i+1];
    if (o[k]==null) o[k] = /^\d+$/.test(nk)?[]:{}; o=o[k]; }
  o[ks.at(-1)] = val;
};
const setP = (path,val)=>{ setPath(STATE.profile,path,val); dirty('profile'); };
const setO = (path,val)=>{ setPath(STATE.offerDoc,path,val); dirty('offer'); };
const setPin = (i,k,val)=>{
  const g = (STATE.profile.targeting_defaults ||= {}).geo ||= {};
  (g.radius_pins ||= [])[i] ||= { label:'', radius_km:5, location_types:['home','recent'], callouts:[] };
  g.radius_pins[i][k] = val; dirty('profile');
};

function dirty(which){ DIRTY[which]=true; const b=$('#saveBtn_'+which); if(b){b.disabled=false;b.textContent='Save changes';} }

    <span id="saveMsg_${which}" style="font-size:12px;color:var(--dim)"></span></div>`;

let SAVE_NOTES = { placed:[], warnings:[] };
async function save(which){
  const btn=$('#saveBtn_'+which), msg=$('#saveMsg_'+which);

  try{
    let said = [];
    if (which==='profile'){ const r = await api('/api/client/'+STATE.sel, {method:'PUT', body:STATE.profile}); STATE.view = r; STATE.profile = r.profile; said = [...(r.placed||[]), ...(r.warnings||[])]; SAVE_NOTES = { placed: r.placed||[], warnings: r.warnings||[] }; }
    else await api(`/api/client/${STATE.sel}/offer/${STATE.offer}`, {method:'PUT', body:STATE.offerDoc});
    DIRTY[which]=false; btn.textContent='Saved'; msg.textContent='written to disk';

  const log=$('#log'); if(log) log.scrollTop=log.scrollHeight;
}

/** The run's log as one text — the command line first, the exit last — on the clipboard, for pasting into a bug report. */
async function copyLog(){
  const r = STATE.run; if (!r) return '';
  const text = [`${r.label}${r.done ? (r.code===0 ? ' · finished' : ` · exited with code ${r.code}`) : ' · still running'}`, ...r.lines.map(l=>l.line)].join('\n');
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch {} ta.remove(); }
  const b = $('#copyLogBtn'); if (b){ b.textContent = ok ? 'Copied' : 'Select and copy'; setTimeout(()=>{ if ($('#copyLogBtn')) $('#copyLogBtn').textContent = 'Copy log'; }, 1800); }
  if (!ok){ const log = $('#log'); if (log){ const range = document.createRange(); range.selectNodeContents(log); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); } }
  return text;
}
/** Stop the run in the log: the run and everything it started end; what it had finished is kept. */
async function stopRunNow(){
  const r = STATE.run; if (!r?.id || r.done) return;
  if (!confirm(`Stop "${r.label}"? What it has finished is kept; what it is doing right now is lost.`)) return;
  r.stopping = true; renderRunBox();
  try { await api(`/api/run/${r.id}/stop`, { method:'POST', body:{} }); }
  catch(e){ r.stopping = false; renderRunBox(); alert('Not stopped: ' + e.message); }
}
async function run(params, after){
  STATE.run = { label:'Starting…', lines:[], done:false, code:null };
  renderRunBox();
  try{
    const { id, label } = await api('/api/run',{method:'POST',body:params});
    attachRun(id, label, after, params.batch || null);
  }catch(e){
    STATE.run = { label:'Failed to start', lines:[{stream:'err',line:e.message}], done:true, code:1 };
    renderRunBox();
  }
}
/** Follow a run's log (the server replays it from the start) and refresh when it ends. */
function attachRun(id, label, after, batch=null){
  STATE.run = { id, label, batch, lines:[], done:false, code:null };
  renderRunBox();
  const es = new EventSource(`/api/run/${id}/stream`);
  es.onmessage = e => {
    if (STATE.run?.id !== id) return es.close();
    STATE.run.lines.push(JSON.parse(e.data));
    const log=$('#log');
    if (log){ const d=STATE.run.lines.at(-1); const div=document.createElement('div');
      div.className=d.stream; div.textContent=d.line; log.appendChild(div); log.scrollTop=log.scrollHeight; }
    else renderRunBox();
  };
  es.addEventListener('done', async e => {
    es.close();
    if (STATE.run?.id !== id) return;
    const end = JSON.parse(e.data);
    STATE.run.done = true; STATE.run.code = end.code; STATE.run.stopped = !!end.stopped; STATE.run.stopping = false;
    // Refresh underlying data, then repaint — the log survives because it lives in STATE.
    STATE.status = await api('/api/status');
    await loadClients();
    if (after) { try { await after(STATE.run.code); } catch(e){ console.error(e); } }
    render();
  });
  es.onerror = ()=>{ es.close(); if (STATE.run?.id===id){ STATE.run.done=true; renderRunBox(); } };
}

// ── Creation ─────────────────────────────────────────────────────────────────
async function newOffer(){
  const offer = prompt('Offer slug:\ne.g. 12wk-challenge'); if(!offer) return;
  try{ await api('/api/clients',{method:'POST',body:{gym:STATE.sel,offer:offer.trim()}});
    await loadClients(); await selectClient(STATE.sel); await loadOffer(offer.trim());
  }catch(e){ alert(e.message); }
}

boot().catch(e=>{ document.body.innerHTML=`<div style="padding:40px;color:#b42323">Failed to start: ${esc(e.message)}</div>`; });
