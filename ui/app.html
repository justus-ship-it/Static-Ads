}
function paintFoot(busy){
  const d = R.data, box = $('#rvFoot'); if (!box) return;
  const st = d.stories;
  box.innerHTML = !d.made ? `<span>The ads render once every photo is in. You can review the photos meanwhile.</span>${d.run?`<button class="sm" onclick="openGenerating('${esc(R.id)}')">Watch progress →</button>`:''}<span class="spacer"></span><span class="keys"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>K</kbd> keep · <kbd>X</kbd> exclude · <kbd>U</kbd> undo</span>`
    : `<span>${st ? `${st.ads} Stories version${st.ads===1?'':'s'} · ${st.image_calls} image call${st.image_calls===1?'':'s'}${st.left_out?` · ${st.left_out} left out`:''}` : 'No Stories versions yet'}</span>
      <button class="sm primary" onclick="rvStoriesConfirm()" ${busy?'disabled':''}>${st?'Make Stories versions again…':'Make Stories versions…'}</button>
      ${st?`<button class="sm" onclick="rvStoriesRerender()" ${busy?'disabled':''}>Re-render Stories (free)</button>`:''}
      <button class="sm" onclick="openWords('${esc(R.id)}')" ${busy?'disabled':''}>Change the words</button>
      <button class="sm ok" onclick="openPublish('${esc(R.id)}')" ${busy?'disabled':''}>Publish to Meta →</button>
      <span class="spacer"></span><span class="keys"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>K</kbd> keep · <kbd>X</kbd> exclude · <kbd>U</kbd> undo</span><span id="rvSaved">${d.saved?'Picks saved':''}</span>`;
}
function paintCounts(){
  const c = R.data.counts, box = $('#rvCount'); if (!box) return;
  const pos = R.list.length ? `<b>${R.i+1}</b> of ${R.list.length}` : 'none';
  box.innerHTML = R.mode==='photos'
    ? `${pos} · ${c.photos_excluded ? `<b>${c.photos_excluded}</b> excluded, with their ads` : 'no photo excluded'}`
    : `${pos} · <b>${c.kept+c.unreviewed}</b> kept${c.unreviewed?` (${c.unreviewed} not reviewed)`:''} · <b>${c.excluded}</b> excluded`;
}
/** The list follows the filters; the position stays on the same item where it can. */
function rvRefresh(){
  R.list = rvList();
  let i = R.cur ? R.list.findIndex(x=>rkey(x)===R.cur) : -1;
  if (i < 0) i = Math.min(R.i, R.list.length-1);
  R.i = Math.max(0, i); R.cur = R.list[R.i] ? rkey(R.list[R.i]) : null;
  paintStage(); paintStrip(); paintCounts();
}
function paintStage(){
  const box = $('#rvStage'); if (!box) return;
  const it = R.list[R.i];
  const nav = `<button class="rv-nav prev" onclick="rvMove(-1)" ${R.i<=0?'disabled':''} title="Previous (←)">‹</button><button class="rv-nav next" onclick="rvMove(1)" ${R.i>=R.list.length-1?'disabled':''} title="Next (→)">›</button>`;
  const info = $('#rvInfo');
  if (!it){ box.innerHTML = `<div style="color:#9fb0d6;align-self:center">${R.show==='all'?'Nothing here yet.':'Nothing matches this filter.'}</div>`; info.innerHTML=''; paintButtons(null); return; }
  const st = it.status, photo = R.mode==='photos';
  const badge = `<div class="rv-badge ${st||''}">${st==='keep'?'✓ Kept':st==='exclude'?(photo?`✕ Excluded, with its ${it.ads} ad${it.ads===1?'':'s'}`:'✕ Excluded'):(photo?'Not reviewed':'Not reviewed · kept unless excluded')}</div>`;
  if (R.mode==='photos'){
    box.innerHTML = `${nav}${badge}<figure class="${st==='exclude'?'ex':''}"><img src="${esc(it.url)}" alt=""><figcaption>${it.kind==='real'?'Real photo':'Generated photo'}</figcaption></figure>`;
    info.innerHTML = `<b>${esc(it.id)}</b>${it.scene_id?`<span>${esc(it.scene_id)}</span>`:''}<span>in ${it.ads} ad${it.ads===1?'':'s'}</span>${it.primary?`<span>made for ${esc(layoutName(it.primary))}</span>`:''}${it.scene?`<span class="scene">${esc(it.scene)}</span>`:''}${(it.notes||[]).length?`<span class="note" title="${esc(it.notes.join(' · '))}">${esc(it.notes.join(' · '))}</span>`:''}`;
  } else {
    box.innerHTML = `${nav}${badge}<figure class="${st==='exclude'?'ex':''}"><img src="${esc(it.url)}" alt=""><figcaption>1:1 · Feed</figcaption></figure>
      <figure class="${st==='exclude'?'ex':''}">${it.story?`<img src="${esc(it.story)}" alt="">`:`<div class="nostory">No Stories version yet.<br>Keep the ads you want, then Make Stories versions below.</div>`}<figcaption>9:16 · Stories / Reels</figcaption></figure>`;
    info.innerHTML = `<b>${esc(it.number)}</b><span>${esc(it.location)}</span><span>${esc(layoutName(it.treatment))} · ${esc(nice(it.style))} · ${esc(nice(it.palette))}</span><span>photo${it.photos.length===1?'':'s'} ${esc(it.photos.join(' + '))}</span>${it.by_photo?`<span class="note">excluded with photo ${esc(it.by_photo)}</span>`:''}${it.notes?`<span class="note" title="${esc(it.notes)}">${esc(it.notes)}</span>`:''}`;
  }
  paintButtons(it);
  // The neighbours load ahead, so moving is instant.
  for (const k of [1,-1,2]) { const n = R.list[R.i+k]; if (n){ new Image().src = n.url; if (n.story) new Image().src = n.story; } }
}
function paintButtons(it){
  const k = $('#rvKeep'), x = $('#rvEx'); if (!k) return;
  k.disabled = x.disabled = !it;
  k.classList.toggle('on', it?.status==='keep'); x.classList.toggle('on', it?.status==='exclude');
  k.textContent = it?.status==='keep' ? '✓ Kept' : '✓ Keep'; x.textContent = it?.status==='exclude' ? '✕ Excluded' : '✕ Exclude';
}
function paintStrip(){
  const box = $('#rvStrip'); if (!box) return;
  box.innerHTML = R.list.map((it,i)=>`<button class="th ${it.status?'s-'+it.status:''} ${i===R.i?'cur':''}" onclick="rvGoto(${i})" title="${esc(it.folder||it.id)}"><img src="${esc(it.url)}" alt="" loading="lazy" decoding="async"></button>`).join('');
  markStrip();
}
function markStrip(){
  const box = $('#rvStrip'); if (!box) return;
  [...box.children].forEach((el,i)=>el.classList.toggle('cur', i===R.i));
  box.children[R.i]?.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
}
function rvMove(d){ const i = R.i + d; if (i<0 || i>=R.list.length) return; R.i = i; R.cur = rkey(R.list[i]); paintStage(); markStrip(); paintCounts(); }
function rvGoto(i){ R.i = i; R.cur = rkey(R.list[i]); paintStage(); markStrip(); paintCounts(); }
function rvMode(m){ if (m===R.mode) return; R.cur = null; R.i = 0; STATE.rmode = m; setHash(); R.mode = m; paintReview($('#view')); }
function rvLoc(l){ R.loc = l; paintReview($('#view')); }
function rvShow(s){ R.show = s; rvRefresh(); }

/** Keep, exclude, or undo (null) the current item; save it; move on to the next one. */
function rvDecide(val){
  const it = R.list[R.i]; if (!it) return;
  if (R.mode==='ads' && it.by_photo && val!=='exclude'){ toast(`Photo ${it.by_photo} is excluded, and this ad with it. Keep the photo (Photos) to use its ads.`, 'err'); return; }
  const k = rkey(it), next = R.list[R.i+1] ? rkey(R.list[R.i+1]) : k;
  let change;
  if (R.mode==='photos'){ it.status = val; change = { photos:{ [it.id]:val } }; }
  else { it.own = val; change = { ads:{ [it.folder]:val } }; }
  restand();
  R.cur = val===null ? k : next;
  rvRefresh();
  savePicks(change);
}
function savePicks(change){
  const saved = $('#rvSaved'); if (saved) saved.textContent = 'Saving…';
  R.save = R.save.then(()=>api(`/api/client/${R.gym}/batch/${R.id}/picks`, { method:'PUT', body:change }))
    .then(()=>{ R.data.saved = true; const s=$('#rvSaved'); if (s) s.textContent = 'Picks saved'; })
    .catch(async e=>{ toast(`Not saved: ${e.message}`, 'err'); try { R.data = await api(`/api/client/${R.gym}/batch/${R.id}/review`); rvRefresh(); } catch {} });
  return R.save;
}
let TOAST_T = null;
function toast(msg, kind=''){
  let t = $('#toast'); if (!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = kind; t.textContent = msg; t.hidden = false;
  clearTimeout(TOAST_T); TOAST_T = setTimeout(()=>{ t.hidden = true; }, 3800);
}
document.addEventListener('keydown', e=>{
  if (STATE.tab!=='review' || !STATE.batch || !R.data || document.querySelector('.modal')) return;
  const t = e.target; if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.length===1 ? e.key.toLowerCase() : e.key;
  const act = { ArrowRight:()=>rvMove(1), ArrowLeft:()=>rvMove(-1), k:()=>rvDecide('keep'), ' ':()=>rvDecide('keep'), x:()=>rvDecide('exclude'), u:()=>rvDecide(null) }[k];
  if (act){ e.preventDefault(); act(); }
});

/** Stories versions of the kept ads: the one thing to confirm is the call cap; the words are the batch's own. */
async function rvStoriesConfirm(){
  await R.save;
  const c = R.data.counts, kept = c.kept + c.unreviewed;
  $('#bModal').innerHTML = `<div class="modal" onclick="if(event.target===this)bClose()"><div class="card">
    <h2>Make Stories versions?</h2>
    <p class="hint">Each kept ad gets a 9:16 version with the same photo, look and words, inside Meta's safe zone. One new photo per photo in a single-photo look; collage and panels ads reuse theirs; real photos cost nothing. The run stops at the call limit, whatever happens.</p>
    <div class="summary"><b>${kept} kept ad${kept===1?'':'s'}</b>${c.unreviewed?` · ${c.unreviewed} of them not reviewed yet (kept unless you exclude them)`:''}${c.excluded?` · ${c.excluded} excluded, left out`:''}</div>
    <div class="row"><label for="bStCap" style="margin:0">Up to</label><input id="bStCap" type="number" min="0" max="40" value="24" style="width:70px"><span class="hint" style="margin:0">Gemini image calls</span></div>
    <div class="row" style="margin-top:12px"><button onclick="bClose()">Cancel</button><div class="spacer"></div><button class="primary" id="bStGo" onclick="rvStoriesGo()" ${kept?'':'disabled'}>Yes, make them</button></div></div></div>`;
}
async function rvStoriesGo(){
  const cap = parseInt($('#bStCap').value, 10), id = R.id; bClose();
  if (!Number.isInteger(cap) || cap < 0){ toast('The call cap must be a whole number.', 'err'); return; }
  if (!R.data.saved) await savePicks({}); // the picks the Stories step reads, as they stand
  run({kind:'batch-stories', gym:STATE.sel, batch:id, confirm:{max_calls:cap}}, async()=>{ R.data = null; });
  paintFoot(true);
}
function rvStoriesRerender(){ run({kind:'batch-stories-rerender', gym:STATE.sel, batch:R.id}, async()=>{ R.data = null; }); paintFoot(true); }

// ── Generating ───────────────────────────────────────────────────────────────
// A batch as it is made: each photo appears as it passes its checks (progress.json, written by the
// run photo by photo), the calls used against the cap, then the ads. Reopening it mid-run picks the
// run's log up again.
const G = { timer:null, data:null };
const STAGE_NOW = { photos:'Generating photos', fit:'Rendering ads', looks:'Rendering ads', render:'Rendering ads', gallery:'Rendering ads', done:'Done', failed:'Stopped' };
async function viewGenerating(v, seq=VIEW_SEQ){
  v.innerHTML = '<p class="sub">Loading…</p>';
  await genPoll(seq);
}
async function genPoll(seq){
  let d;
  try { d = await api(`/api/client/${STATE.sel}/batch/${STATE.batch}/progress`); }
  catch(e){ if (seq===VIEW_SEQ) $('#view').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  if (seq !== VIEW_SEQ) return;
  G.data = d;
  paintCrumb(`${d.words.offer}${d.words.audience?` · ${d.words.audience}`:''}`);
  if (d.run && STATE.run?.id !== d.run.id) attachRun(d.run.id, d.run.label, async()=>{ B.setup = null; }, STATE.batch);
  paintGenerating();
  clearTimeout(G.timer);
  if (d.run) G.timer = setTimeout(()=>genPoll(seq), 1500);
}
function paintGenerating(){
  const v = $('#view'), d = G.data, p = d.progress;
  const photos = Object.entries(p?.photos || {});
  const passed = photos.filter(([,x])=>x.state==='passed').length, settled = photos.filter(([,x])=>['passed','flagged','skipped','error'].includes(x.state)).length;
  const stage = p?.stage || (d.made ? 'done' : 'photos'), done = stage==='done' && !d.run, failed = stage==='failed';
  const spent = (p?.spent_before||0) + (p?.calls||0);
  const RENDER = { fit:74, looks:80, render:88, gallery:96 };
  const pct = done ? 100 : stage==='photos' ? Math.round(70 * (photos.length ? settled/photos.length : 1)) : (RENDER[stage] || 70);
  const step = (label, state) => `<div class="${state}">${state==='done'?'✓ ':state==='now'?'● ':''}${label}</div>`;
  const inPhotos = stage==='photos', inAds = !!RENDER[stage];
  const title = failed ? 'Stopped' : done ? `Done · ${p?.ads ?? ''} ads` : inAds ? 'Rendering the ads' : `Generating · ${passed} of ${photos.length} photo${photos.length===1?'':'s'}`;
  const stale = !d.run && p && !done && !failed;
  const mine = STATE.run?.batch === STATE.batch;
  const latest = mine ? STATE.run.lines.filter(l=>l.stream!=='meta').at(-1)?.line : null;
  const keepLog = $('#runbox')?.closest('details')?.open;
  v.innerHTML = `
  <div class="steps">${step('Brief','done')}<i>›</i>${step('Photos', inPhotos&&!failed?'now':(inAds||done)?'done':'')}<i>›</i>${step('Ads', inAds?'now':done?'done':'')}<i>›</i>${step('Review', done?'now':'')}</div>
  <h1>${esc(title)}</h1>
  <p class="sub">${failed ? '' : inPhotos ? 'Each photo appears as it passes its checks. ' : ''}${spent} image call${spent===1?'':'s'} used of ${p?.max_calls ?? '—'}${p?.real?` · plus ${p.real} real photo${p.real===1?'':'s'}`:''}${inAds?' · no image calls while rendering':''}</p>
  ${failed ? `<div class="msg err">${esc(p.error||'the run stopped')}</div>` : ''}
  ${stale ? `<div class="msg warn">This run is not running any more; it stopped while ${esc((STAGE_NOW[stage]||stage).toLowerCase())}. Run the batch again from Create to finish it (photos already made are reused).</div>` : ''}
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="gen">${photos.map(([id,x])=>genCard(id,x)).join('') || '<div class="hint">No new photos in this batch: real photos only.</div>'}</div>
  <div class="row" style="margin-top:16px">
    ${d.made ? `<button class="primary" onclick="openReview('${esc(STATE.batch)}','ads')">Review ${p?.ads ?? ''} ads →</button>` : passed ? `<button class="keep" onclick="openReview('${esc(STATE.batch)}','photos')">Review the ${passed} passed photo${passed===1?'':'s'} →</button>` : ''}
    ${!d.made && d.run ? '<span class="hint" style="margin:0">The ads render as soon as the photos are in; you can review photos meanwhile.</span>' : ''}
    <div class="spacer"></div><button onclick="go('batch')">Back to Create</button>
  </div>
  ${latest ? `<div class="latest" title="${esc(latest)}">${esc(latest)}</div>` : ''}
  ${mine ? `<details style="margin-top:10px" ${keepLog?'open':''}><summary>Full log</summary><div id="runbox"></div></details>` : ''}`;
  renderRunBox();
}
function genCard(id, x){
  const S = {
    queued:['queued',''], checking:['checking…','navy'], generating:['generating…','navy'], retrying:[`trying again`,'warn'],
    passed:['passed','on'], flagged:['not used','err'], skipped:['skipped',''], error:['error','err'],
  }[x.state] || [x.state,''];
  const busy = ['checking','generating'].includes(x.state);
  const img = x.url ? `<img src="${esc(x.url)}" alt="">` : '';
  const over = x.state==='checking' ? '<div class="over">checking…</div>' : x.state==='generating' ? '<div class="over" style="background:none;color:var(--dim)">generating…</div>' : '';
  const why = (x.failures||[]).join(' · ');
  return `<div class="gc ${busy?'busy':''} ${x.state==='flagged'?'flagged':''} ${x.state==='passed'?'click':''}" ${x.state==='passed'?`onclick="R.pendingCur='${esc(id)}';openReview('${esc(STATE.batch)}','photos')"`:''} title="${esc(why)}">
    <div class="ph">${img || (x.state==='queued'?'queued':'')}${over}</div>
    <div class="m"><b>${esc(id)} · ${esc(x.scene_id||'scene')}</b><div class="s">${esc(x.scene||'')}</div>
      <div class="row"><span class="pill ${S[1]}">${S[0]}</span>${x.attempt>1&&x.state!=='queued'?`<span class="pill">try ${x.attempt}</span>`:''}${x.reused?'<span class="pill">from disk</span>':''}${(x.notes||[]).length?`<span class="pill warn" title="${esc(x.notes.join(' · '))}">note</span>`:''}${x.own_layout_failed?'<span class="pill" title="Its own layout did not work out; it is used in the layouts it fits">other layouts</span>':''}</div>
    </div></div>`;
}

function paintAssets(v){
  const d = A.data, by = k => d.assets.filter(a=>a.kind===k);
  const running = STATE.run && !STATE.run.done && /^photo-/.test(STATE.run.id||'');
  const card = (a) => `<div class="asset ${a.kind==='logo'?'is-logo':''} ${A.sel.has(a.name)&&a.kind==='facility'?'sel':''}">
      <div class="im" ${a.kind==='facility'?`onclick="aToggle('${esc(a.name)}')"`:''}><img src="${esc(a.url)}" alt="" loading="lazy"></div>
      ${a.kind==='facility'?`<span class="tick">${A.sel.has(a.name)?'✓':''}</span>`:''}
      ${a.kind==='facility'&&a.cleaned?'<span class="pill on tag">cleaned</span>':''}${a.kind==='logo'&&a.in_use?'<span class="pill on tag">in use</span>':''}
      <div class="m"><b title="${esc(a.original_name||a.name)}">${esc(a.name)}</b>${a.size?`${a.size[0]}×${a.size[1]} · `:''}${a.bytes>=1048576?(a.bytes/1048576).toFixed(1)+' MB':Math.round(a.bytes/1024)+' KB'} · ${esc(a.source)} ${esc(a.added)}
        <div class="row">${a.kind==='logo'&&!a.in_use?`<button class="sm" onclick="aUseLogo('${esc(a.path)}')">Use as logo</button>`:''}<button class="sm" onclick="aRemove('${esc(a.kind)}','${esc(a.name)}')">Remove</button></div></div>
    </div>`;
  const section = (k, hint, extra='') => { const xs = by(k.id); return `<div class="card"><div class="row"><h3 style="margin:0">${esc(k.label)} <span class="pill">${xs.length}</span></h3><div class="spacer"></div>${extra}</div>
      ${hint?`<p class="hint" style="margin-top:8px">${hint}</p>`:''}${xs.length?`<div class="assets" style="margin-top:10px">${xs.map(card).join('')}</div>`:`<div class="hint" style="margin:8px 0 0">Nothing yet — drop files above with <b>${esc(k.label)}</b> chosen.</div>`}</div>`; };
  const fac = d.kinds.find(k=>k.id==='facility'), n = A.sel.size;
  v.innerHTML = `<h1>Photos & brand assets</h1><p class="sub">The gym's own files, kept with its profile: drop them here and they are filed and remembered. Premises photos are cleaned from here before a batch can use them.</p>
  <div class="card"><h3>Add files</h3>
    <div class="chips" id="aKinds">${d.kinds.map(k=>`<span class="chip ${A.kind===k.id?'sel':''}" onclick="A.kind='${k.id}';paintAssets($('#view'))">${esc(k.label)}</span>`).join('')}</div>
    <div class="drop" id="aDrop" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="aDrop(event)">
      Drop photos here as <b>${esc(d.kinds.find(k=>k.id===A.kind)?.label||A.kind)}</b>, or <label class="lnk">choose files<input type="file" id="aFile" multiple accept=".png,.jpg,.jpeg,.webp,.heic${A.kind==='logo'?',.svg':''},image/*" hidden onchange="aFiles(this.files)"></label>
      <div style="font-size:12px;margin-top:6px;color:var(--faint)">PNG, JPG, WEBP${d.heic?' or an iPhone HEIC (converted here)':''}${A.kind==='logo'?', or an SVG for the logo':''} · up to ${Math.round(d.max_bytes/1048576)} MB each · a file already here is not added twice</div>
    </div>
    <div id="aMsgs"></div>
  </div>
  <div class="card"><div class="row"><h3 style="margin:0">Cleaned premises photos <span class="pill">${d.clean.length}</span></h3></div>
    <p class="hint" style="margin-top:8px">What batches use as real photos and as the room reference: old marks and lettering removed, checked. Made from the premises photos below.</p>
    ${d.clean.length?`<div class="thumbs">${d.clean.map(p=>`<label><img src="${esc(p.url)}" alt="" style="width:168px;height:112px"><span style="font-size:11.5px">${esc(p.path.split('/').pop())}</span></label>`).join('')}</div>`:'<div class="hint" style="margin:0">None yet — select premises photos below and clean them.</div>'}
  </div>
  ${section(fac, 'Click photos to select them, then survey what a clean-up would remove (free) or clean them (about 4 image calls each). Cleaned copies keep the same name.',
    `<button class="sm" ${n&&!running?'':'disabled'} onclick="aSurvey()">Survey ${n||''} (free)</button><button class="sm primary" ${n&&!running?'':'disabled'} onclick="aClean()">Clean ${n||''}…</button>`)}
  ${d.kinds.filter(k=>k.id!=='facility').map(k=>section(k, k.id==='logo'?'The profile\'s logo file is marked in use; it is kept for later and never drawn on the offer-first ads.':k.id==='brand'?'Screenshots of the website, brand guidelines, past ads the gym made itself.':'')).join('')}
  <div id="runbox"></div>`;
  renderRunBox();
}
function aToggle(name){ if (A.sel.has(name)) A.sel.delete(name); else A.sel.add(name); paintAssets($('#view')); }
function aMsg(file, text, cls=''){ const box = $('#aMsgs'); if (!box) return; let el = box.querySelector(`[data-f="${CSS.escape(file)}"]`); if (!el){ el = document.createElement('div'); el.className='amsg'; el.dataset.f=file; box.appendChild(el); } el.className = `amsg ${cls}`; el.textContent = `${file}: ${text}`; }
function aDrop(ev){ ev.preventDefault(); $('#aDrop')?.classList.remove('over'); aFiles(ev.dataTransfer.files); }
async function aFiles(files){ await aUploadKind(files, A.kind, async()=>{ await loadAssets(); const box=$('#aMsgs'); const keep=box?box.innerHTML:''; paintAssets($('#view')); const b2=$('#aMsgs'); if (b2) b2.innerHTML = keep; }); }
/** Upload files one by one as raw bytes; the server keeps images only, named from the file, filed by kind. */
async function aUploadKind(files, kind, after){
  for (const f of [...files]) {
    const m = f.name.match(/\.(png|jpe?g|webp|heic|svg)$/i);
    const ext = m ? m[1].toLowerCase().replace('jpeg','jpg') : (f.type==='image/png'?'png':f.type==='image/webp'?'webp':f.type==='image/svg+xml'?'svg':'jpg');
    const name = `${slugify(f.name.replace(/\.[^.]+$/,'')).slice(0,48) || kind}.${ext}`;
    aMsg(f.name, 'uploading…');
    try {
      const r = await fetch(`/api/client/${STATE.sel}/asset/${kind}/${name}`, { method:'PUT', headers:{'content-type':f.type||'application/octet-stream','x-panel-token':TOKEN,'x-original-name':encodeURIComponent(f.name)}, body: await f.arrayBuffer() });
      const j = await r.json().catch(()=>({error:'bad response'}));
      if (!r.ok) throw new Error(j.error || r.statusText);
      aMsg(f.name, `saved as ${j.asset.path}${j.asset.logo_set?" · now the profile's logo":''}`, 'ok');
      if (j.asset.logo_set) await refreshProfile();
    } catch(e){ aMsg(f.name, e.message, 'err'); }
  }
  if (after) await after();
}
async function saveProfileNow(){ const r = await api('/api/client/'+STATE.sel, {method:'PUT', body:STATE.profile}); STATE.view = r; STATE.profile = r.profile; DIRTY.profile = false; }
async function aUseLogo(path){ setP('brand_lock.logo.files.primary', path); try { await saveProfileNow(); } catch(e){ alert(e.message); return; } if (STATE.tab==='photos'){ await loadAssets(); paintAssets($('#view')); } else render(); }
async function aRemove(kind, name){
  if (!confirm(`Move ${name} to the trash folder? (brand-assets/_trash — nothing is deleted)`)) return;
  try { await api(`/api/client/${STATE.sel}/asset/${kind}/${name}`, {method:'DELETE'}); } catch(e){ alert(e.message); }
  await loadAssets(); paintAssets($('#view'));
}
function aSurvey(){ run({kind:'photo-survey', gym:STATE.sel, photos:[...A.sel]}, async()=>{ await loadAssets(); paintAssets($('#view')); }); }
function aClean(){
  const photos = [...A.sel];
  const cap = prompt(`Clean ${photos.length} premises photo${photos.length===1?'':'s'} with Gemini edits: old marks, signage and web controls removed, checked afterwards. Most image calls to spend (about 4 per photo):`, String(photos.length*4));
  if (cap == null) return;
  const n = parseInt(cap, 10);
  if (!(n >= photos.length)) return alert(`At least one call per photo (${photos.length}).`);
  run({kind:'photo-clean', gym:STATE.sel, photos, confirm:{max_calls:n}}, async()=>{ await loadAssets(); paintAssets($('#view')); });
}
async function viewReferences(v, seq=VIEW_SEQ){
  v.innerHTML = '<h1>Reference images</h1><p class="sub">Loading…</p>';
  if (B.gym !== STATE.sel || !B.scenes){ B.gym = STATE.sel; await loadSetup(); }
  if (seq !== VIEW_SEQ) return;
  if (!B.draft) B.draft = freshDraft();
  const refs = B.scenes.references || [];
  v.innerHTML = `<h1>Reference images</h1><p class="sub">Images you supply for direction. Each is read once into words (activity, people, framing, mood); the words on it are kept out, and the image itself never goes into a generated photo.</p>
    <div class="card">${refs.length ? `<div class="thumbs">${refs.map(r=>`<label><img src="${esc(r.url)}" alt="" style="width:220px;height:146px"><span style="font-size:12px">${esc(r.name)}${r.read?' · read':''}</span></label>`).join('')}</div>` : '<div class="hint">No reference images yet.</div>'}
      <div class="row" style="margin-top:12px"><input type="file" id="bRefFile" accept="image/png,image/jpeg,image/webp" style="width:auto" onchange="bUpload(this)"><span id="bRefMsg" class="hint" style="margin:0"></span></div></div>`;
}

// ── Edit + save ──────────────────────────────────────────────────────────────
const setPath = (obj,path,val) => {
  const ks = path.split('.'); let o = obj;
  for (let i=0;i<ks.length-1;i++){ const k=ks[i], nk=ks[i+1];
    if (o[k]==null) o[k] = /^\d+$/.test(nk)?[]:{}; o=o[k]; }
  o[ks.at(-1)] = val;
};
const setP = (path,val)=>{ setPath(STATE.profile,path,val); dirty('profile'); };
const setO = (path,val)=>{ setPath(STATE.offerDoc,path,val); dirty('offer'); };
const setPin = (i,k,val)=>{
  const g = (STATE.profile.targeting_defaults ||= {}).geo ||= {};
  (g.radius_pins ||= [])[i] ||= { label:'', radius_km:5, location_types:['home','recent'], callouts:[] };
  g.radius_pins[i][k] = val; dirty('profile');
};

let DIRTY = {};
function dirty(which){ DIRTY[which]=true; const b=$('#saveBtn_'+which); if(b){b.disabled=false;b.textContent='Save changes';} }
function saveBar(which){
  return `<div class="row" style="position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line)">
    <button class="primary" id="saveBtn_${which}" ${DIRTY[which]?'':'disabled'} onclick="save('${which}')">${DIRTY[which]?'Save changes':'Saved'}</button>
    <span id="saveMsg_${which}" style="font-size:12px;color:var(--dim)"></span></div>`;
}
async function save(which){
  const btn=$('#saveBtn_'+which), msg=$('#saveMsg_'+which);
  btn.disabled=true; btn.textContent='Saving…';
  try{
    if (which==='profile'){ const r = await api('/api/client/'+STATE.sel, {method:'PUT', body:STATE.profile}); STATE.view = r; STATE.profile = r.profile; }
    else await api(`/api/client/${STATE.sel}/offer/${STATE.offer}`, {method:'PUT', body:STATE.offerDoc});
    DIRTY[which]=false; btn.textContent='Saved'; msg.textContent='written to disk';
    await loadClients(); render();
  }catch(e){ btn.disabled=false; btn.textContent='Save changes'; msg.innerHTML=`<span style="color:var(--err)">${esc(e.message)}</span>`; }
}

async function validate(){
  const out=$('#valout'); out.innerHTML='<div class="msg">Validating…</div>';
  try{
    const r = await api('/api/validate',{method:'POST',body:{gym:STATE.sel,offer:STATE.offer}});
    out.innerHTML =
      r.errors.map(e=>`<div class="msg err">${esc(e)}</div>`).join('') +
      r.warnings.map(w=>`<div class="msg warn">${esc(w)}</div>`).join('') +
      (r.errors.length?'':`<div class="msg ok">Valid. Resolved brief written — budget ${esc(r.resolved?.campaign?.budget?.amount??'—')} ${esc(r.resolved?.campaign?.budget?.currency??'')}, radius ${esc(r.resolved?.targeting?.geo?.radius_pins?.[0]?.radius_km??'—')}km.</div>`);
  }catch(e){ out.innerHTML=`<div class="msg err">${esc(e.message)}</div>`; }
}

// ── Runs ─────────────────────────────────────────────────────────────────────
/** Paint the current run from STATE, so a re-render never destroys the log. */
function renderRunBox(){
  const box=$('#runbox'); if(!box) return;
  const r=STATE.run; if(!r){ box.innerHTML=''; return; }
  box.innerHTML=`<div class="card" style="margin-top:14px">
    <div class="row"><h2 style="margin:0">${esc(r.label)}</h2>
      <span class="pill ${r.done&&r.code===0?'on':(r.done?'warn':'navy')}">${r.done?(r.code===0?'finished':'exit '+r.code):'running…'}</span>
      <div class="spacer"></div>
      <button class="sm" id="copyLogBtn" onclick="copyLog()" title="the whole log, command line first, ready to paste">Copy log</button>
      <button class="sm" onclick="STATE.run=null;renderRunBox()">Clear</button></div>
    <div class="log" id="log">${r.lines.map(l=>`<div class="${esc(l.stream)}">${esc(l.line)}</div>`).join('')}</div>
  </div>`;
  const log=$('#log'); if(log) log.scrollTop=log.scrollHeight;
}

/** The run's log as one text — the command line first, the exit last — on the clipboard, for pasting into a bug report. */
async function copyLog(){
  const r = STATE.run; if (!r) return '';
  const text = [`${r.label}${r.done ? (r.code===0 ? ' · finished' : ` · exited with code ${r.code}`) : ' · still running'}`, ...r.lines.map(l=>l.line)].join('\n');
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch {} ta.remove(); }
  const b = $('#copyLogBtn'); if (b){ b.textContent = ok ? 'Copied' : 'Select and copy'; setTimeout(()=>{ if ($('#copyLogBtn')) $('#copyLogBtn').textContent = 'Copy log'; }, 1800); }
  if (!ok){ const log = $('#log'); if (log){ const range = document.createRange(); range.selectNodeContents(log); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); } }
  return text;
}
async function run(params, after){
  STATE.run = { label:'Starting…', lines:[], done:false, code:null };
  renderRunBox();
  try{
    const { id, label } = await api('/api/run',{method:'POST',body:params});
    attachRun(id, label, after, params.batch || null);
  }catch(e){
    STATE.run = { label:'Failed to start', lines:[{stream:'err',line:e.message}], done:true, code:1 };
    renderRunBox();
  }
}
/** Follow a run's log (the server replays it from the start) and refresh when it ends. */
function attachRun(id, label, after, batch=null){
  STATE.run = { id, label, batch, lines:[], done:false, code:null };
  renderRunBox();
  const es = new EventSource(`/api/run/${id}/stream`);
  es.onmessage = e => {
    if (STATE.run?.id !== id) return es.close();
    STATE.run.lines.push(JSON.parse(e.data));
    const log=$('#log');
    if (log){ const d=STATE.run.lines.at(-1); const div=document.createElement('div');
      div.className=d.stream; div.textContent=d.line; log.appendChild(div); log.scrollTop=log.scrollHeight; }
    else renderRunBox();
  };
  es.addEventListener('done', async e => {
    es.close();
    if (STATE.run?.id !== id) return;
    STATE.run.done = true; STATE.run.code = JSON.parse(e.data).code;
    // Refresh underlying data, then repaint — the log survives because it lives in STATE.
    STATE.status = await api('/api/status');
    await loadClients();
    if (after) { try { await after(STATE.run.code); } catch(e){ console.error(e); } }
    render();
  });
  es.onerror = ()=>{ es.close(); if (STATE.run?.id===id){ STATE.run.done=true; renderRunBox(); } };
}

// ── Creation ─────────────────────────────────────────────────────────────────
async function newOffer(){
  const offer = prompt('Offer slug:\ne.g. 12wk-challenge'); if(!offer) return;
  try{ await api('/api/clients',{method:'POST',body:{gym:STATE.sel,offer:offer.trim()}});
    await loadClients(); await selectClient(STATE.sel); await loadOffer(offer.trim());
  }catch(e){ alert(e.message); }
}

boot().catch(e=>{ document.body.innerHTML=`<div style="padding:40px;color:#b42323">Failed to start: ${esc(e.message)}</div>`; });
