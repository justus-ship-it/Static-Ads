<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="panel-token" content="">
<title>Gym Ads Control Panel</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel-2:#1c2128; --line:#30363d;
    --text:#e6edf3; --dim:#8b949e; --accent:#e8501f; --accent-dim:#7a2a10;
    --ok:#3fb950; --warn:#d29922; --err:#f85149; --link:#58a6ff;
    --radius:8px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  a{color:var(--link)}
  button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);padding:7px 13px}
  button:hover:not(:disabled){border-color:var(--dim)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover:not(:disabled){filter:brightness(1.1)}
  input,select,textarea{font:inherit;background:#0d1117;color:var(--text);
    border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:64px}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px;font-weight:500}

  .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  .side{background:var(--panel);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:18px}
  .brand{font-weight:700;font-size:15px;letter-spacing:-.2px}
  .brand span{color:var(--accent)}
  .main{padding:22px 26px;max-width:1100px}

  .clients{display:flex;flex-direction:column;gap:3px}
  .client{padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;font-size:13px}
  .client:hover{background:var(--panel-2)}
  .client.sel{background:var(--panel-2);border-color:var(--accent)}
  .client .nm{font-weight:600}
  .client .sub{font-size:11px;color:var(--dim)}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
  .tab{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--dim);font-size:13px;font-weight:500}
  .tab:hover{color:var(--text)}
  .tab.sel{color:var(--text);border-bottom-color:var(--accent)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .card h3{margin:0 0 4px;font-size:14px}
  .card .hint{color:var(--dim);font-size:12px;margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spacer{flex:1}

  .chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
  .chk:last-child{border-bottom:none}
  .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--err)} .dot.opt{background:var(--dim)}
  .chk .t{font-weight:600;font-size:13px}
  .chk .d{color:var(--dim);font-size:12px}
  .chk .fix{font-family:ui-monospace,monospace;font-size:11px;color:var(--warn);margin-top:3px}

  .msg{padding:8px 11px;border-radius:6px;font-size:12.5px;margin-bottom:6px;border-left:3px solid}
  .msg.err{background:rgba(248,81,73,.09);border-color:var(--err)}
  .msg.warn{background:rgba(210,153,34,.09);border-color:var(--warn)}
  .msg.ok{background:rgba(63,185,80,.09);border-color:var(--ok)}

  .log{background:#010409;border:1px solid var(--line);border-radius:6px;padding:11px;
    height:300px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap}
  .log .out{color:#c9d1d9} .log .err{color:var(--err)} .log .meta{color:var(--accent)}

  .pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--dim)}
  .pill.on{border-color:var(--ok);color:var(--ok)}
  .empty{color:var(--dim);text-align:center;padding:40px 20px}
  fieldset{border:1px solid var(--line);border-radius:6px;padding:12px;margin:0 0 12px}
  legend{font-size:12px;color:var(--dim);padding:0 6px}

  /* New Batch */
  .nb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,430px);gap:14px;align-items:start}
  @media (max-width:1100px){ .nb{grid-template-columns:minmax(0,1fr)} .pvcard{position:static} }
  .nb .card label{margin-top:10px}
  .pvcard{position:sticky;top:12px}
  .pv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pv figure{margin:0} .pv img{width:100%;display:block;border-radius:4px;background:#000;aspect-ratio:1}
  .pv figcaption{font-size:11px;color:var(--dim);margin-top:3px}
  .pv .bad{color:var(--err)} .pv .good{color:var(--ok)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chip{padding:2px 9px;border-radius:99px;border:1px solid var(--line);font-size:12px;cursor:pointer;color:var(--dim)}
  .chip.sel{border-color:var(--accent);color:var(--text)}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap}
  .thumbs label{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text)}
  .thumbs img{width:120px;height:80px;object-fit:cover;border-radius:4px;border:2px solid transparent}
  .thumbs input:checked+img{border-color:var(--accent)}
  .thumbs input{width:auto}
  .locrow{display:flex;gap:6px;margin-bottom:6px} .locrow button{padding:3px 9px}
  .summary{font-size:13px;margin:10px 0;color:var(--text)} .summary b{color:var(--accent)}
  .ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  .ads img{width:100%;display:block;border-radius:3px} .ads div{font-size:11px;color:var(--dim)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal .card{max-width:520px;width:92%}
  .words{background:#010409;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:10px 0;font-size:13px}
  .words div{margin:2px 0} .words span{color:var(--dim);display:inline-block;width:92px}
  details summary{cursor:pointer;color:var(--dim);font-size:12px;margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Gym Ads <span>Control Panel</span></div>
    <div>
      <div class="row" style="margin-bottom:8px">
        <strong style="font-size:12px;color:var(--dim)">CLIENTS</strong>
        <div class="spacer"></div>
        <button onclick="newClient()" style="padding:3px 9px;font-size:12px">+ New</button>
      </div>
      <div class="clients" id="clients"></div>
    </div>
    <div class="spacer"></div>
    <div id="sideStatus" style="font-size:11px;color:var(--dim)"></div>
  </aside>

  <main class="main">
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </main>
</div>

<script>
const $ = (s,r=document)=>r.querySelector(s);
// This launch's token, put in the page by the panel. Writes and runs without it are refused, so a
// page on another site cannot drive the panel.
const TOKEN = document.querySelector('meta[name="panel-token"]').content;
const api = async (path, opts={}) => {
  const r = await fetch(path, { headers:{'content-type':'application/json','x-panel-token':TOKEN}, ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(()=>({error:'bad response'}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let STATE = { clients:[], sel:null, offer:null, tab:'setup', status:null, enums:null, profile:null, offerDoc:null, run:null };

const TABS = [
  ['setup','Setup'], ['brand','Brand'], ['offer','Offer'],
  ['targeting','Targeting & Budget'], ['batch','New Batch'], ['generate','Templates (old)'], ['review','Review'],
];

async function boot(){
  STATE.status = await api('/api/status');
  STATE.enums  = await api('/api/enums');
  await loadClients();
  render();
}

async function loadClients(){
  const { clients } = await api('/api/clients');
  STATE.clients = clients;
  if (STATE.sel && !clients.find(c=>c.gym===STATE.sel)) STATE.sel = null;
  if (!STATE.sel && clients.length) selectClient(clients[0].gym, false);
}

async function selectClient(gym, doRender=true){
  STATE.sel = gym;
  const c = STATE.clients.find(x=>x.gym===gym);
  STATE.offer = c?.offers?.[0] || null;
  const d = await api('/api/client/'+gym);
  STATE.profile = d.profile;
  STATE.offerDoc = STATE.offer ? await api(`/api/client/${gym}/offer/${STATE.offer}`) : null;
  if (doRender) render();
}

async function loadOffer(slug){
  STATE.offer = slug;
  STATE.offerDoc = await api(`/api/client/${STATE.sel}/offer/${slug}`);
  render();
}

function render(){
  // sidebar
  $('#clients').innerHTML = STATE.clients.length ? STATE.clients.map(c=>`
    <div class="client ${c.gym===STATE.sel?'sel':''}" onclick="selectClient('${esc(c.gym)}')">
      <div class="nm">${esc(c.display_name||c.gym)}</div>
      <div class="sub">${c.offers.length} offer${c.offers.length===1?'':'s'} · ${c.outputs.length} batch${c.outputs.length===1?'':'es'}</div>
    </div>`).join('') : '<div style="color:var(--dim);font-size:12px">No clients yet</div>';

  const bad = STATE.status.checks.filter(c=>!c.ok && !c.optional).length;
  $('#sideStatus').innerHTML = `Node ${esc(STATE.status.node)}<br>` +
    (bad ? `<span style="color:var(--err)">${bad} setup item${bad===1?'':'s'} blocking</span>` : `<span style="color:var(--ok)">setup complete</span>`);

  $('#tabs').innerHTML = TABS.map(([k,l])=>
    `<div class="tab ${STATE.tab===k?'sel':''}" onclick="STATE.tab='${k}';render()">${l}</div>`).join('');

  const v = $('#view');
  if (STATE.tab==='setup') return viewSetup(v);
  if (!STATE.sel) { v.innerHTML = `<div class="empty">No client selected.<br><br><button class="primary" onclick="newClient()">Create your first gym</button></div>`; return; }
  if (STATE.tab==='brand') return viewBrand(v);
  if (STATE.tab==='offer') return viewOffer(v);
  if (STATE.tab==='targeting') return viewTargeting(v);
  if (STATE.tab==='batch') return viewBatch(v);
  if (STATE.tab==='generate') return viewGenerate(v);
  if (STATE.tab==='review') return viewReview(v);
}

// ── Setup ────────────────────────────────────────────────────────────────────
function viewSetup(v){
  v.innerHTML = `
  <div class="card">
    <h3>Setup status</h3>
    <p class="hint">What is configured on this machine, and what each missing piece blocks.</p>
    ${STATE.status.checks.map(c=>`
      <div class="chk">
        <div class="dot ${c.ok?'ok':(c.optional?'opt':'bad')}"></div>
        <div style="flex:1">
          <div class="t">${esc(c.label)} ${c.ok?'<span class="pill on">ready</span>':(c.optional?'<span class="pill">optional</span>':'<span class="pill">missing</span>')}</div>
          <div class="d">Blocks: ${esc(c.blocks)}</div>
          ${c.ok?'':`<div class="fix">${esc(c.fix)}</div>`}
        </div>
      </div>`).join('')}
    <div class="row" style="margin-top:12px">
      <button onclick="boot()">Re-check</button>
      <button onclick="run({kind:'checksync'})">Check skill/command sync</button>
    </div>
  </div>
  <div id="runbox"></div>`;
  renderRunBox();
}

// ── Brand ────────────────────────────────────────────────────────────────────
function viewBrand(v){
  const p = STATE.profile;
  if (!p) { v.innerHTML = '<div class="empty">No gym-profile.json for this client.</div>'; return; }
  const L = p.brand_lock ||= {};
  const C = L.colors ||= {};
  const loc = (p.locations ||= [{}])[0];
  const col = (k,lbl) => `
    <div>
      <label>${lbl} hex</label>
      <div class="row" style="gap:6px;flex-wrap:nowrap">
        <input type="color" style="width:42px;padding:2px;flex:none" value="${esc(C[k]?.hex||'#000000')}"
          oninput="setP('brand_lock.colors.${k}.hex',this.value); this.nextElementSibling.value=this.value">
        <input class="mono" value="${esc(C[k]?.hex||'')}" placeholder="#000000"
          oninput="setP('brand_lock.colors.${k}.hex',this.value); this.previousElementSibling.value=/^#[0-9a-fA-F]{6}$/.test(this.value)?this.value:'#000000'">
      </div>
      <input style="margin-top:6px" placeholder="name, e.g. Iron Navy" value="${esc(C[k]?.name||'')}"
        oninput="setP('brand_lock.colors.${k}.name',this.value)">
    </div>`;

  v.innerHTML = `
  <div class="card">
    <h3>Identity</h3>
    <p class="hint">Used to build campaign and ad names, so these must be importer-safe (no em dashes).</p>
    <div class="grid">
      <div><label>Display name</label><input value="${esc(p.display_name||'')}" oninput="setP('display_name',this.value)"></div>
      <div><label>Abbreviation (2-4 caps)</label><input class="mono" value="${esc(p.gym_abbr||'')}" oninput="setP('gym_abbr',this.value.toUpperCase())"></div>
      <div><label>Website</label><input value="${esc(p.website||'')}" oninput="setP('website',this.value)"></div>
    </div>
  </div>

  <div class="card">
    <h3>Location</h3>
    <p class="hint">The postal code drives radius targeting — the single most important field for a gym.</p>
    <div class="grid">
      <div><label>Label</label><input value="${esc(loc.label||'')}" oninput="setP('locations.0.label',this.value)"></div>
      <div><label>Address</label><input value="${esc(loc.address||'')}" oninput="setP('locations.0.address',this.value)"></div>
      <div><label>Postal code</label><input class="mono" value="${esc(loc.postal_code||'')}" oninput="setP('locations.0.postal_code',this.value)"></div>
      <div><label>Nearest MRT</label><input value="${esc(loc.nearest_mrt||'')}" oninput="setP('locations.0.nearest_mrt',this.value)"></div>
      <div><label>Latitude</label><input class="mono" value="${esc(loc.lat??'')}" oninput="setP('locations.0.lat',parseFloat(this.value)||null)"></div>
      <div><label>Longitude</label><input class="mono" value="${esc(loc.lng??'')}" oninput="setP('locations.0.lng',parseFloat(this.value)||null)"></div>
    </div>
  </div>

  <div class="card">
    <h3>Brand lock <span class="pill on">overrides auto-detection</span></h3>
    <p class="hint">These colours win over anything the website scrape guesses. This is the gym's jurisdiction over its own look.</p>
    <div class="grid">${col('primary','Primary')}${col('secondary','Secondary')}${col('accent','Accent')}</div>
    <fieldset style="margin-top:14px"><legend>Photography</legend>
      <div class="grid">
        <div><label>Must show (one per line)</label><textarea oninput="setP('brand_lock.photography.must',this.value.split('\\n').filter(Boolean))">${esc((L.photography?.must||[]).join('\n'))}</textarea></div>
        <div><label>Never show (one per line)</label><textarea oninput="setP('brand_lock.photography.never',this.value.split('\\n').filter(Boolean))">${esc((L.photography?.never||[]).join('\n'))}</textarea></div>
      </div>
    </fieldset>
    <div class="row"><span style="font-size:12px;color:var(--dim)">Assets on disk:</span>
      ${Object.entries(STATE.clients.find(c=>c.gym===STATE.sel)?.asset_counts||{}).map(([k,n])=>
        `<span class="pill ${n>0?'on':''}">${k}: ${n}</span>`).join('')}
    </div>
  </div>
  ${saveBar('profile')}`;
}

// ── Offer ────────────────────────────────────────────────────────────────────
function viewOffer(v){
  const c = STATE.clients.find(x=>x.gym===STATE.sel);
  const o = STATE.offerDoc;
  const picker = `
    <div class="card"><div class="row">
      <label style="margin:0">Offer</label>
      <select style="width:auto;min-width:200px" onchange="loadOffer(this.value)">
        ${(c?.offers||[]).map(s=>`<option ${s===STATE.offer?'selected':''}>${esc(s)}</option>`).join('')}
      </select>
      <button onclick="newOffer()">+ New offer</button>
    </div></div>`;
  if (!o) { v.innerHTML = picker + '<div class="empty">No offer yet. Create one to define what this campaign sells.</div>'; return; }
  const P = o.price ||= {}, M = o.mechanics ||= {}, S = o.scarcity ||= {}, D = o.destination ||= {}, G = o.guarantee ||= {}, MSG = o.messaging ||= {};

  v.innerHTML = picker + `
  <div class="card">
    <h3>The offer</h3>
    <p class="hint">This is what your ads sell. Phase 2 fills image prompts from it and Phase 4 writes copy from it.</p>
    <div class="grid">
      <div><label>Name</label><input value="${esc(o.name||'')}" oninput="setO('name',this.value)"></div>
      <div><label>Type</label><select onchange="setO('offer_type',this.value)">
        ${STATE.enums.offerTypes.map(t=>`<option ${t===o.offer_type?'selected':''}>${t}</option>`).join('')}</select></div>
      <div><label>Duration</label><div class="row" style="flex-wrap:nowrap">
        <input type="number" value="${esc(o.duration?.value??'')}" oninput="setO('duration.value',parseInt(this.value)||null)">
        <select style="width:110px" onchange="setO('duration.unit',this.value)">
          ${['weeks','days','months','sessions'].map(u=>`<option ${u===o.duration?.unit?'selected':''}>${u}</option>`).join('')}</select>
      </div></div>
    </div>
  </div>

  <div class="card">
    <h3>Price</h3>
    <p class="hint">"Display" is the exact string copy must use — it is never re-derived from the number.</p>
    <div class="grid">
      <div><label>Amount (SGD)</label><input type="number" value="${esc(P.amount??'')}" oninput="setO('price.amount',parseFloat(this.value)||null)"></div>
      <div><label>Display string</label><input class="mono" placeholder="$397" value="${esc(P.display||'')}" oninput="setO('price.display',this.value)"></div>
      <div><label>Qualifier</label><select onchange="setO('price.qualifier',this.value)">
        ${STATE.enums.priceQualifiers.map(q=>`<option ${q===P.qualifier?'selected':''}>${q}</option>`).join('')}</select></div>
      <div><label>GST treatment</label><select onchange="setO('price.gst_treatment',this.value)">
        ${['inclusive','exclusive','not_registered'].map(g=>`<option ${g===P.gst_treatment?'selected':''}>${g}</option>`).join('')}</select></div>
      <div><label>Compare-at amount</label><input type="number" value="${esc(P.compare_at?.amount??'')}" oninput="setO('price.compare_at.amount',parseFloat(this.value)||null)"></div>
      <div><label>Compare-at basis</label><input placeholder="12 x $60 drop-in" value="${esc(P.compare_at?.basis||'')}" oninput="setO('price.compare_at.basis',this.value)"></div>
    </div>
  </div>

  <div class="card">
    <h3>What's included</h3>
    <div class="grid">
      <div><label>Included items (one per line)</label><textarea oninput="setO('mechanics.whats_included',this.value.split('\\n').filter(Boolean))">${esc((M.whats_included||[]).join('\n'))}</textarea></div>
      <div><label>Who it's for</label><textarea oninput="setO('mechanics.who_its_for',this.value)">${esc(M.who_its_for||'')}</textarea></div>
    </div>
  </div>

  <div class="card">
    <h3>Urgency <span class="pill">must be real</span></h3>
    <p class="hint">Fabricated scarcity is blocked at validation. A capacity claim needs a real spot count.</p>
    <div class="grid">
      <div><label>Type</label><select onchange="setO('scarcity.type',this.value);render()">
        ${['none','deadline','cohort_start','capacity'].map(t=>`<option ${t===S.type?'selected':''}>${t}</option>`).join('')}</select></div>
      ${S.type==='deadline'?`<div><label>Signup deadline</label><input type="date" value="${esc((S.signup_deadline||'').slice(0,10))}" oninput="setO('scarcity.signup_deadline',this.value)"></div>`:''}
      ${S.type==='cohort_start'?`<div><label>Cohort start date</label><input type="date" value="${esc((S.cohort_start_date||'').slice(0,10))}" oninput="setO('scarcity.cohort_start_date',this.value)"></div>`:''}
      ${S.type==='capacity'?`
        <div><label>Spots available</label><input type="number" value="${esc(M.capacity?.spots??'')}" oninput="setO('mechanics.capacity.spots',parseInt(this.value)||null);setO('mechanics.capacity.limited',true)"></div>
        <div><label>Verifiable?</label><select onchange="setO('mechanics.capacity.claim_verifiable',this.value==='yes')">
          <option value="yes" ${M.capacity?.claim_verifiable!==false?'selected':''}>yes</option>
          <option value="no" ${M.capacity?.claim_verifiable===false?'selected':''}>no</option></select></div>`:''}
    </div>
  </div>

  <div class="card">
    <h3>Destination & compliance</h3>
    <div class="grid">
      <div><label>Landing / booking URL</label><input value="${esc(D.landing_url||'')}" oninput="setO('destination.landing_url',this.value)"></div>
      <div><label>Call to action</label><select onchange="setO('destination.primary_cta',this.value)">
        ${STATE.enums.cta.map(t=>`<option ${t===D.primary_cta?'selected':''}>${t}</option>`).join('')}</select></div>
      <div><label>Guarantee posture</label><select onchange="setO('guarantee.posture',this.value)">
        ${['none','satisfaction','conditional_refund','free_trial_only'].map(t=>`<option ${t===G.posture?'selected':''}>${t}</option>`).join('')}</select></div>
      <div><label>Guarantee text</label><input value="${esc(G.text||'')}" oninput="setO('guarantee.text',this.value)"></div>
      <div style="grid-column:1/-1"><label>Never say (one per line) — enforced on generated copy</label>

// ── New Batch (offer-first, Step 7) ──────────────────────────────────────────
// The form is painted once; typing only updates the parts that depend on it (errors, summary,
// preview), so the field being typed in never loses focus. Every rule is the server's (Step 6).
const B = { gym:null, setup:null, draft:null, check:null, preview:null, loc:0, seqC:0, seqP:0, tC:null, tP:null,
  mode:'new', view:null, savedId:null, touched:false };
const today = () => new Date().toISOString().slice(0,10);
const slugify = s => String(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

async function viewBatch(v){
  if (B.gym !== STATE.sel){ Object.assign(B, { gym:STATE.sel, draft:null, mode:'new', view:null, savedId:null, touched:false, loc:0 }); }
  v.innerHTML = '<div class="card"><h3>New batch</h3><p class="hint">Loading…</p></div>';
  B.setup = await api(`/api/client/${STATE.sel}/batch-setup`);
  if (!B.draft) B.draft = freshDraft();
  paintBatch(v);
  scheduleCheck(0); schedulePreview(0);
}

function freshDraft(){
  return { batch_id:'', offer:'', locations:[''], audience:'', generated:2, real:B.setup.photos.slice(0,2).map(p=>p.path),
    looks_per_photo:2, max_calls:'', attempts:2, seed:'' };
}

/** The brief exactly as typed: words are never trimmed or re-cased — the checks say if they need fixing. */
function briefFromDraft(){
  const d = B.draft;
  const words = { offer:d.offer, locations:d.locations.filter(s=>s!==''), audience:d.audience===''?null:d.audience };
  if (B.mode==='rerender') return { ...B.view.brief, ...words };
  const generated = Number(d.generated)||0, attempts = Number(d.attempts)||1;
  return { batch_id: d.batch_id || autoId(), ...words, free:false, generated, real:d.real, looks_per_photo:Number(d.looks_per_photo)||1,
    max_calls: d.max_calls===''? generated*attempts : Number(d.max_calls), attempts, scenes:null, ...(d.seed?{seed:d.seed}:{}) };
}
function autoId(){
  const base = `${today()}-${slugify(B.draft.offer).slice(0,40) || 'batch'}`.replace(/-+$/,'');
  const taken = new Set(B.setup.batches.map(b=>b.id).filter(id=>id!==B.savedId));
  let id = base, n = 2; while (taken.has(id)) id = `${base}-${n++}`;
  return id;
}

      <label for="bOffer">Offer</label>

      <div id="bErrors"></div>
      <div id="bSummary" class="summary"></div>
      <div class="row">
        ${re ? `<button class="primary" id="bRerender" onclick="bRerender()">Save words and re-render (free)</button>`
             : `<button id="bPlan" onclick="bPlan()">Plan (free)</button><button class="primary" id="bRun" onclick="bConfirm()">Run batch…</button>`}
        <span id="bMsg" style="font-size:12px;color:var(--dim)"></span>
      </div>
    </div>
    <div class="card pvcard">
      <h3>Live preview</h3>
      <p class="hint">Sample looks with your words, on your cleaned photos. The batch picks its own looks; these show how the words fit.</p>
      <div class="chips" id="bLocTabs"></div>
      <div id="bPrevMsg"></div>
      <div class="pv" id="bPrev"></div>
    </div>
  </div>
  <div class="card"><h3>Batches</h3><div id="bList"></div></div>
  <div id="bResult"></div>
  <div id="runbox"></div>
  <div id="bModal"></div>`;
  paintLocs(); paintList(); paintResult(); renderRunBox(); paintDerived();
}

function paintLocs(){
  const d = B.draft, maxL = B.setup.maxLocations||4;
  $('#bLocs').innerHTML = d.locations.map((l,i)=>`<div class="locrow"><input id="bLoc${i}" value="${esc(l)}" placeholder="e.g. BISHAN" oninput="bLoc(${i},this.value)">

      <div class="row" style="margin-top:4px">${b.gallery?`<a href="${esc(b.gallery)}" target="_blank">Open gallery →</a>`:''}

function paintResult(){
  const box = $('#bResult'); if (!box) return;
  const v = B.view;
  if (!v || !v.batch || !B.showAds){ box.innerHTML=''; return; }
  box.innerHTML = `<div class="card"><div class="row"><h3 style="margin:0">${esc(v.brief.batch_id)} — ${v.batch.ads.length} ads</h3><div class="spacer"></div>
    ${v.gallery?`<a href="${esc(v.gallery)}" target="_blank">Open gallery →</a>`:''}</div>
    <p class="hint">${v.batch.image_calls} image call${v.batch.image_calls===1?'':'s'} · made ${esc(new Date(v.batch.made).toLocaleString())}${v.batch.failed?.length?` · ${v.batch.failed.length} look(s) could not be verified and were left out`:''}</p>
    <div class="ads">${v.batch.ads.map(a=>`<div><a href="${esc(a.url)}" target="_blank"><img src="${esc(a.url)}" alt="" loading="lazy"></a><div>${esc(a.folder.split('-')[0])} · ${esc(a.location)} · ${esc(a.treatment.split('-')[0])}</div></div>`).join('')}</div></div>`;
}

/** Everything that depends on the draft: errors, summary, scene status, buttons. */
function paintDerived(){
  const c = B.check, s = c?.summary, sc = B.setup.scenes;
  const scenes = $('#bScenes');
  if (scenes) scenes.innerHTML = B.mode==='rerender' ? '' : !sc.exists ? 'Scene library: none yet — generated photos need one.'
    : `Scene library: ${sc.approved?'<span style="color:var(--ok)">approved</span>':'<span style="color:var(--warn)">not approved yet</span>'} · ${Object.entries(sc.counts).map(([k,n])=>`${n} for ${esc(k)}`).join(', ')}${sc.drafts?` · <span style="color:var(--warn)">${sc.drafts} new scene${sc.drafts===1?'':'s'} awaiting approval</span>`:''}${s?` · this audience draws from <b>${esc(s.scenes_for)}</b>`:''}`;
  const errs = c?.errors || [];
  const eb = $('#bErrors');
  if (eb) eb.innerHTML = errs.length && B.touched ? errs.map(e=>`<div class="msg err">${esc(e)}</div>`).join('') : '';
  const sb = $('#bSummary');
  if (sb) sb.innerHTML = s ? (B.mode==='rerender'
      ? `${s.ads} ads re-rendered with these words · <b>0 image calls</b>`
      : `${s.photos} photo${s.photos===1?'':'s'} × ${s.looks} look${s.looks===1?'':'s'} × ${s.locations} location${s.locations===1?'':'s'} = <b>${s.ads} ads</b> · at most <b>${s.max_calls} image call${s.max_calls===1?'':'s'}</b>`) : '';
  const busy = STATE.run && !STATE.run.done;
  for (const id of ['bPlan','bRun','bRerender']) { const b=$('#'+id); if (b) b.disabled = !c || errs.length>0 || busy; }
}

function paintPreview(){
  const d = B.draft, locs = d.locations.filter(s=>s!=='');
  const tabs = $('#bLocTabs'); if (!tabs) return;
  if (B.loc >= locs.length) B.loc = 0;
  tabs.innerHTML = locs.length>1 ? locs.map((l,i)=>`<span class="chip ${i===B.loc?'sel':''}" onclick="B.loc=${i};schedulePreview(0)">${esc(l)}</span>`).join('') : '';
  const p = B.preview, msg = $('#bPrevMsg'), grid = $('#bPrev');
  if (!p){ grid.innerHTML=''; msg.innerHTML='<div class="hint">Rendering…</div>'; return; }
  msg.innerHTML = p.errors?.length ? (d.offer===''&&!B.touched ? '<div class="hint">Type the offer and a location to see the ads.</div>' : p.errors.map(e=>`<div class="msg warn">${esc(e)}</div>`).join('')) : '';
  grid.innerHTML = (p.looks||[]).map(l=>`<figure>${l.url?`<img src="${esc(l.url)}" alt="${esc(l.label)}">`:'<div style="aspect-ratio:1;background:#000;border-radius:4px"></div>'}
    <figcaption><b>${esc(l.label)}</b> · ${l.ok?'<span class="good">fits</span>':`<span class="bad">${esc(l.failures[0]||'does not fit')}</span>`}</figcaption></figure>`).join('');
}

function scheduleCheck(ms=250){ clearTimeout(B.tC); B.tC = setTimeout(doCheck, ms); }
function schedulePreview(ms=500){ clearTimeout(B.tP); B.tP = setTimeout(doPreview, ms); }
async function doCheck(){
  const seq = ++B.seqC;
  try { const r = await api(`/api/client/${STATE.sel}/batch/check`, {method:'POST', body:{brief:briefFromDraft()}}); if (seq===B.seqC){ B.check=r; paintDerived(); } }
  catch(e){ if (seq===B.seqC){ B.check={errors:[e.message]}; paintDerived(); } }
}
async function doPreview(){
  const seq = ++B.seqP, br = briefFromDraft(), locs = br.locations;
  B.preview = null; paintPreview();
  try {
    const r = await api('/api/preview', {method:'POST', body:{ gym:STATE.sel, offer:br.offer, location:locs[B.loc]??locs[0]??'', audience:br.audience, photos:br.real }});
    if (seq===B.seqP){ B.preview=r; paintPreview(); }
  } catch(e){ if (seq===B.seqP){ B.preview={errors:[e.message],looks:[]}; paintPreview(); } }
}

const WORDS = new Set(['offer','audience']);
function bSet(k, v){ B.draft[k]=v; B.touched=true; scheduleCheck(); if (WORDS.has(k) || k==='generated') schedulePreview(); }
function bLoc(i, v){ B.draft.locations[i]=v; B.touched=true; scheduleCheck(); schedulePreview(); }
function bLocAdd(){ B.draft.locations.push(''); paintLocs(); $('#bLoc'+(B.draft.locations.length-1))?.focus(); scheduleCheck(); }
function bLocDel(i){ B.draft.locations.splice(i,1); paintLocs(); scheduleCheck(); schedulePreview(0); }
function bReal(path, on){ const r=B.draft.real; if (on && !r.includes(path)) r.push(path); if (!on) r.splice(r.indexOf(path),1); B.touched=true; scheduleCheck(); schedulePreview(); }
function bMsg(t, cls=''){ const m=$('#bMsg'); if (m) m.innerHTML = cls?`<span style="color:var(--${cls})">${esc(t)}</span>`:esc(t); }

/** Write the brief to disk (validated again by the server), returning it as saved. */
async function saveBrief(){
  const brief = briefFromDraft();
  const replace = B.mode==='rerender' || B.savedId===brief.batch_id;
  try {
    const r = await api(`/api/client/${STATE.sel}/batch`, {method:'POST', body:{brief, replace}});
    B.savedId = brief.batch_id; return { brief, summary:r.summary };
  } catch(e){ bMsg(e.message, 'err'); B.touched=true; await doCheck(); return null; }
}
async function bPlan(){
  const s = await saveBrief(); if (!s) return;
  run({kind:'batch-plan', gym:STATE.sel, batch:s.brief.batch_id}, async()=>{ B.setup = await api(`/api/client/${STATE.sel}/batch-setup`); });
}
async function bConfirm(){
  const fresh = B.savedId !== briefFromDraft().batch_id; // this confirmation is what saves it
  const s = await saveBrief(); if (!s) return;
  B.createdByConfirm = fresh;
  const b = s.brief, sm = s.summary;
  $('#bModal').innerHTML = `<div class="modal" onclick="if(event.target===this)bCancel()"><div class="card">
    <h3>Run this batch?</h3>
    <p class="hint">These words go on every ad exactly as shown. The run stops at the call limit, whatever happens.</p>
    <div class="words"><div><span>Offer</span>${esc(b.offer)}</div><div><span>Locations</span>${esc(b.locations.join(' / '))}</div><div><span>Audience</span>${b.audience?esc(b.audience):'<i style="color:var(--dim)">none</i>'}</div></div>
    <div class="summary">${sm.photos} photos × ${sm.looks} looks × ${sm.locations} locations = <b>${sm.ads} ads</b><br>Up to <b>${b.max_calls} Gemini image call${b.max_calls===1?'':'s'}</b> for ${b.generated} new photo${b.generated===1?'':'s'}</div>
    <div class="row"><button onclick="bCancel()">Cancel</button><div class="spacer"></div>
      <button class="primary" id="bGo" onclick="bGo()">Yes, run — up to ${b.max_calls} image call${b.max_calls===1?'':'s'}</button></div></div></div>`;
  B.pending = b;
}
function bClose(){ $('#bModal').innerHTML=''; B.pending=null; }
/** Cancel: nothing runs, and a brief that only the confirmation had saved is discarded again. */
async function bCancel(){
  const id = B.pending?.batch_id, fresh = B.createdByConfirm; bClose();
  if (fresh && id){ try { await api(`/api/client/${STATE.sel}/batch/${id}`, {method:'DELETE'}); B.savedId = null; } catch(e){} }
}
async function bDiscard(id){
  if (!confirm(`Discard the planned batch ${id}? It has no ads yet.`)) return;
  try {
    await api(`/api/client/${STATE.sel}/batch/${id}`, {method:'DELETE'}); if (B.savedId===id) B.savedId = null;
    B.setup = await api(`/api/client/${STATE.sel}/batch-setup`); paintList();
  } catch(e){ bMsg(e.message, 'err'); }
}
function bGo(){
  const b = B.pending; bClose();
  run({kind:'batch', gym:STATE.sel, batch:b.batch_id, confirm:{offer:b.offer, locations:b.locations, audience:b.audience??null, max_calls:b.max_calls}}, async(code)=>{
    B.setup = await api(`/api/client/${STATE.sel}/batch-setup`);
    if (code===0){ B.view = await api(`/api/client/${STATE.sel}/batch/${b.batch_id}`); B.showAds=true; B.mode='rerender'; B.draft.batch_id=b.batch_id; }
  });
}
async function bRerender(){
  const s = await saveBrief(); if (!s) return;
  run({kind:'batch-rerender', gym:STATE.sel, batch:s.brief.batch_id}, async(code)=>{
    B.setup = await api(`/api/client/${STATE.sel}/batch-setup`);
    if (code===0){ B.view = await api(`/api/client/${STATE.sel}/batch/${s.brief.batch_id}`); B.showAds=true; }
  });
}
async function bShow(id){ B.view = await api(`/api/client/${STATE.sel}/batch/${id}`); B.showAds=true; paintResult(); $('#bResult').scrollIntoView({behavior:'smooth'}); }
async function bWords(id){

// ── Edit + save ──────────────────────────────────────────────────────────────
const setPath = (obj,path,val) => {
  const ks = path.split('.'); let o = obj;
  for (let i=0;i<ks.length-1;i++){ const k=ks[i], nk=ks[i+1];
    if (o[k]==null) o[k] = /^\d+$/.test(nk)?[]:{}; o=o[k]; }
  o[ks.at(-1)] = val;
};
const setP = (path,val)=>{ setPath(STATE.profile,path,val); dirty('profile'); };
const setO = (path,val)=>{ setPath(STATE.offerDoc,path,val); dirty('offer'); };
const setPin = (k,val)=>{
  const g = STATE.profile.targeting_defaults.geo ||= {};
  (g.radius_pins ||= [])[0] ||= { label:'', location_types:['home','recent'] };
  g.radius_pins[0][k] = val; dirty('profile');
};

let DIRTY = {};
function dirty(which){ DIRTY[which]=true; const b=$('#saveBtn_'+which); if(b){b.disabled=false;b.textContent='Save changes';} }
function saveBar(which){
  return `<div class="row" style="position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line)">
    <button class="primary" id="saveBtn_${which}" ${DIRTY[which]?'':'disabled'} onclick="save('${which}')">${DIRTY[which]?'Save changes':'Saved'}</button>
    <span id="saveMsg_${which}" style="font-size:12px;color:var(--dim)"></span></div>`;
}
async function save(which){
  const btn=$('#saveBtn_'+which), msg=$('#saveMsg_'+which);
  btn.disabled=true; btn.textContent='Saving…';
  try{
    if (which==='profile') await api('/api/client/'+STATE.sel, {method:'PUT', body:STATE.profile});
    else await api(`/api/client/${STATE.sel}/offer/${STATE.offer}`, {method:'PUT', body:STATE.offerDoc});
    DIRTY[which]=false; btn.textContent='Saved'; msg.textContent='written to disk';
    await loadClients(); render();
  }catch(e){ btn.disabled=false; btn.textContent='Save changes'; msg.innerHTML=`<span style="color:var(--err)">${esc(e.message)}</span>`; }
}

async function validate(){
  const out=$('#valout'); out.innerHTML='<div class="msg">Validating…</div>';
  try{
    const r = await api('/api/validate',{method:'POST',body:{gym:STATE.sel,offer:STATE.offer}});
    out.innerHTML =
      r.errors.map(e=>`<div class="msg err">${esc(e)}</div>`).join('') +
      r.warnings.map(w=>`<div class="msg warn">${esc(w)}</div>`).join('') +
      (r.errors.length?'':`<div class="msg ok">Valid. Resolved brief written — budget ${esc(r.resolved?.campaign?.budget?.amount??'—')} ${esc(r.resolved?.campaign?.budget?.currency??'')}, radius ${esc(r.resolved?.targeting?.geo?.radius_pins?.[0]?.radius_km??'—')}km.</div>`);
  }catch(e){ out.innerHTML=`<div class="msg err">${esc(e.message)}</div>`; }
}

// ── Runs ─────────────────────────────────────────────────────────────────────
/** Paint the current run from STATE, so a re-render never destroys the log. */
function renderRunBox(){
  const box=$('#runbox'); if(!box) return;
  const r=STATE.run; if(!r){ box.innerHTML=''; return; }
  box.innerHTML=`<div class="card">
    <div class="row"><h3 style="margin:0">${esc(r.label)}</h3>
      <span class="pill ${r.done&&r.code===0?'on':''}">${r.done?(r.code===0?'finished':'exit '+r.code):'running…'}</span>
      <div class="spacer"></div>
      <button onclick="STATE.run=null;renderRunBox()" style="padding:3px 9px;font-size:12px">Clear</button></div>
    <div class="log" id="log">${r.lines.map(l=>`<div class="${esc(l.stream)}">${esc(l.line)}</div>`).join('')}</div>
  </div>`;
  const log=$('#log'); if(log) log.scrollTop=log.scrollHeight;
}

async function run(params, after){
  STATE.run = { label:'Starting…', lines:[], done:false, code:null };
  renderRunBox();
  try{
    const { id, label } = await api('/api/run',{method:'POST',body:params});
    STATE.run.label = label; renderRunBox();
    const es = new EventSource(`/api/run/${id}/stream`);
    es.onmessage = e => {
      STATE.run.lines.push(JSON.parse(e.data));
      const log=$('#log');
      if (log){ const d=STATE.run.lines.at(-1); const div=document.createElement('div');
        div.className=d.stream; div.textContent=d.line; log.appendChild(div); log.scrollTop=log.scrollHeight; }
      else renderRunBox();
    };
    es.addEventListener('done', async e => {
      es.close();
      STATE.run.done = true; STATE.run.code = JSON.parse(e.data).code;
      // Refresh underlying data, then repaint — the log survives because it lives in STATE.
      STATE.status = await api('/api/status');
      await loadClients();
      if (after) { try { await after(STATE.run.code); } catch(e){ console.error(e); } }
      render();
    });
    es.onerror = ()=>{ es.close(); STATE.run.done=true; renderRunBox(); };
  }catch(e){
    STATE.run = { label:'Failed to start', lines:[{stream:'err',line:e.message}], done:true, code:1 };
    renderRunBox();
  }
}

// ── Creation ─────────────────────────────────────────────────────────────────
async function newClient(){
  const gym = prompt('Client slug (lowercase, hyphens):\ne.g. ironhaus'); if(!gym) return;
  const offer = prompt('First offer slug:\ne.g. 6wk-challenge') || null;
  try{ await api('/api/clients',{method:'POST',body:{gym:gym.trim(),offer:offer?.trim()||null}});
    await loadClients(); await selectClient(gym.trim()); STATE.tab='brand'; render();
  }catch(e){ alert(e.message); }
}
async function newOffer(){
  const offer = prompt('Offer slug:\ne.g. 12wk-challenge'); if(!offer) return;
  try{ await api('/api/clients',{method:'POST',body:{gym:STATE.sel,offer:offer.trim()}});
    await loadClients(); await selectClient(STATE.sel); await loadOffer(offer.trim());
  }catch(e){ alert(e.message); }
}

boot().catch(e=>{ document.body.innerHTML=`<div style="padding:40px;color:#f85149">Failed to start: ${esc(e.message)}</div>`; });
